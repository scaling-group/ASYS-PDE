defaults:
- runtime: default
- loop: phase2_self_optimize_multi_feature
- driver: asys
- logger: many_loggers
- application: keller-segel-radial-2d
- optimizer: keller-segel-radial-2d
- evaluation: keller-segel-radial-2d
- _self_
label: keller-segel-radial-2d
loop:
  max_iterations: 10
  n_workers_phase2: 2
  n_parallel_phase2: 1
  produce_optimizer_in_phase2: 2
  sampling:
    solver_examples:
      features:
        score: null
        physics:
          weight: 1.0
          temperature: 1.0
        ic:
          weight: 1.0
          temperature: 1.0
        bc:
          weight: 1.0
          temperature: 1.0
        ic_tangent:
          weight: 1.0
          temperature: 1.0
    produced_optimizers:
      features:
        score: null
        physics:
          weight: 1.0
          temperature: 1.0
        ic:
          weight: 1.0
          temperature: 1.0
        bc:
          weight: 1.0
          temperature: 1.0
        ic_tangent:
          weight: 1.0
          temperature: 1.0
  n_solver_examples_phase2: 4
driver:
  timeout_seconds: 7200
  rollout_max_turns: 10000
  budget_prompt: false
logger:
  wandb:
    enabled: false
