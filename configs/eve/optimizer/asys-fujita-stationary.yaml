# @package _global_
optimizer:
  initial_guidance: configs/eve/optimizer/asys-fujita-stationary/initial_guidance
  workers:
    selection:
      _target_: scaling_evolve.algorithms.eve.workspace.worker_selection.RandomWorkerSelector
    items:
    - name: fujita-profile
      weight: 1.0
      immutable: configs/eve/optimizer/asys-fujita-stationary/immutable
      prompt: configs/eve/optimizer/asys-fujita-stationary/prompt
  immutable_renderer:
    _target_: scaling_evolve.algorithms.eve.workspace.immutable_renderers.default.DefaultRenderer
  evaluation:
    _target_: scaling_evolve.algorithms.eve.populations.evaluators.elo.VectorEloEvaluator
    k_factors:
      physics: 32.0
      ic: 32.0
      ic_tangent: 32.0
      bc: 32.0
    initial_score:
      elo: 1500.0
