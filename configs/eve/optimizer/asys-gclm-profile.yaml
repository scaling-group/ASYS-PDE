# @package _global_
optimizer:
  initial_guidance: configs/eve/optimizer/asys-gclm-profile/initial_guidance
  workers:
    selection:
      _target_: scaling_evolve.algorithms.eve.workspace.worker_selection.RandomWorkerSelector
    items:
    - name: gclm-profile
      weight: 1.0
      immutable: configs/eve/optimizer/asys-gclm-profile/immutable
      prompt: configs/eve/optimizer/asys-gclm-profile/prompt
  immutable_renderer:
    _target_: scaling_evolve.algorithms.eve.workspace.immutable_renderers.default.DefaultRenderer
  evaluation:
    _target_: scaling_evolve.algorithms.eve.populations.evaluators.elo.VectorEloEvaluator
    k_factors:
      physics: 32.0
      normalization: 0.0
      refinement: 0.0
    initial_score:
      elo: 1500.0
