# @package _global_
optimizer:
  immutable_renderer:
    _target_: scaling_evolve.algorithms.eve.workspace.immutable_renderers.default.DefaultRenderer
  initial_guidance: configs/eve/optimizer/asys-hj-inverse/initial_guidance
  workers:
    selection:
      _target_: scaling_evolve.algorithms.eve.workspace.worker_selection.RandomWorkerSelector
    items:
      - name: hj-field
        weight: 1.0
        immutable: configs/eve/optimizer/asys-hj-inverse/immutable
        prompt: configs/eve/optimizer/asys-hj-inverse/prompt
  evaluation:
    _target_: scaling_evolve.algorithms.eve.populations.evaluators.elo.EvalScalarEloEvaluator
    expression: score['score']
    k_factor: 32.0
    initial_score: {elo: 1500.0}
