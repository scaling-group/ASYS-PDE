seed: 0
n_core: 12
n_first: 6
# Warm baseline: solver_e4da6f5b83fa's exported fitted field.
# Thirteen positive kernels with independent L4 and L8 shapes. The new L8 scalars
# enter cubically in time, preserving both inherited initial PDE jets.
# The 312 existing temporal coefficients continue fitting from their source.
# 338 trainable scalars; 375 buffer scalars (312 previously fitted).
# Total inherited fitted initialization: 637 scalars.
time_degree: 12
shape_bound: 0.02
shape8_bound: 0.005
