# nodes per radial cell: 576 x 64 continuous PDE probes, including t=0.
n_x: 144
n_time: 64
n_collocation: 9216
n_ic: 256
n_bc: 128
boundary_weight: 1.0
coefficient_regularization: 1.0e-10
shape_regularization: 1.0e-10
shape8_regularization: 1.0e-10
