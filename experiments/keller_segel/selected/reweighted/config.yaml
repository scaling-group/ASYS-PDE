seed: 0
n_core: 12
n_first: 6
time_degree: 12
# Exact warm initialization from solver_cfc3a9238a37's exported fitted state.
# Same bounded temporal field class, 13 Gaussians and 312 trainable scalars.
# 637 buffers: 312 acff seed + 312 frozen cfc reference corrections + 12 rates
# + one correction bound. No manual fitting or optimizer steps are allowed.
initialization: inherited_cfc3a9238a37
correction_bound: 6.0
# Retain cfc's radial/time quadrature and all 64 times, including the endpoints.
# Four Gauss nodes per cell give 576 x 64 continuous training probes.
n_x: 144
n_time: 64
n_collocation: 9216
n_ic: 256
n_bc: 128
boundary_weight: 1.0
coefficient_regularization: 1.0e-10
force_conditioning: true
force_conditioning_exponent: 0.5
force_conditioning_max_weight: 32.0
# W_t=clip((mean(E_ref)/E_ref(t))^.5,1,32)/mean(W).
# E_ref is the inherited area's mean ut^2+D^2+C^2; never the current field.
# The normalized metric retains every time with a positive weight. It gives
# early forces more influence and may trade late absolute residual for early
# relative accuracy. Public scoring remains unmodified raw MSE.
optimizer: DampedGaussNewton
gn_initial_damping: 0.01
gn_max_trials: 5
gn_max_coefficient_step: 2.0
gn_max_curve_step: 2.0
max_steps: 100000
wall_time: 300.0

